# Local-only overlay. Coolify must not load this file.
#
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  app:
    env_file:
      - .env.local
    environment:
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      PM2_HOME: /tmp/.pm2

  nginx:
    ports:
      - '${HOST_PORT:-3000}:80'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^2.6.1

  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mime: ^2.1.0
  path: ^1.9.1
  record: ^6.2.1
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Production / Coolify Compose.
#
# Coolify injects UI env as a runtime `.env` on every service — do not
# require .env.local here (gitignored, not on the server) and do not
# ${interpolate} secrets (build-time.env does not have them).
# Coolify also sets the project name — do not add a top-level `name:`.
#
# Assign the public domain to the **nginx** service (container port 80).
# Do not publish host ports; Coolify Traefik routes internally.
#
# Local laptop:
#   docker compose --env-file .env.local -f docker-compose.yml \
#     -f docker-compose.local.yml up --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Internal only. Never publish 6379.

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      PM2_HOME: /tmp/.pm2
      # Pinned to the sidecar. Do not set REDIS_URL in Coolify.
      REDIS_URL: redis://redis:6379
    expose:
      - '3000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1/api/health || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis-data:

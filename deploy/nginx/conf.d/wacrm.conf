# Docker embedded DNS. ipv6=off: `app` has an AAAA record but Next.js
# listens on IPv4 only. Nginx then 111s IPv6, marks the peer dead, and
# every later request is "no live upstreams" → 502.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Next.js /login sends large Set-Cookie + Link + RSC headers.
    # Default 4k proxy_buffer_size → "upstream sent too big header" → 502
    # and nginx disables the peer for fail_timeout.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Variable proxy_pass re-resolves app:3000 so Coolify recreates
    # do not leave nginx pinned to a dead container IP.
    set $wacrm_upstream http://app:3000;

    location /api/whatsapp/webhook {
        proxy_pass $wacrm_upstream;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass $wacrm_upstream;
    }
}
